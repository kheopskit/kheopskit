name: CI
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The changeset gate reads `git show <base>:<path>` and diffs
          # three-dot against the base, neither of which the default shallow
          # clone has the history for.
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm check
      - name: Build packages
        run: pnpm build:packages
      - name: Knip
        run: pnpm knip
      - name: Bundle isolation
        run: pnpm check:isolation
      - name: Type declarations
        run: pnpm check:dts
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      # Last, so the real signal above lands first — but `!cancelled()` instead
      # of the default `success()`, otherwise a lint failure hides a missing
      # changeset and you discover it only on the next push.
      #
      # Gated at the step rather than the job: the release PR must still run
      # everything above, yet can never satisfy the gate — it rewrites
      # peerDependencies through `sync-peer-deps` while deleting the changesets
      # it consumed.
      #
      # The exemption also checks the head repo, because `head_ref` is just a
      # branch name the PR author picks: a fork could otherwise call its branch
      # `changeset-release/main` and skip the gate entirely.
      - name: Changeset
        if: ${{ !cancelled() && github.event_name == 'pull_request' && !(github.head_ref == 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          # Fetched into a local branch, not just `origin/<base>`: the gate asks
          # `changeset status` whether the change is released, and Changesets
          # resolves the bare `baseBranch` name from .changeset/config.json —
          # `git merge-base main HEAD` fails where no refs/heads/main exists, and
          # a checkout of a pull request has none. That failure reaches the gate
          # as "no release plan", i.e. a bogus "Missing changeset".
          git fetch --no-tags --force origin "+refs/heads/${{ github.base_ref }}:refs/heads/${{ github.base_ref }}"
          BASE_REF="${{ github.base_ref }}" pnpm check:changeset

  e2e:
    name: E2E (production builds, mock wallets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build:packages
      - name: Build examples
        run: pnpm build:examples
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Run e2e tests
        run: pnpm test:e2e:run
      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
