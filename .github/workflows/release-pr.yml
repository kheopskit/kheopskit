name: Create Release PR
on:
  push:
    branches:
      - main
permissions: {}
jobs:
  version:
    name: Create Release Pull Request
    runs-on: ubuntu-latest
    if: |
      github.repository == 'kheopskit/kheopskit' && !startsWith(github.event.head_commit.message, 'Version Packages')
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Create Release Pull Request or Log No Changes
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset-release-pr
          github-token: ${{ secrets.GITHUB_TOKEN }}
        # The action reads the token from its input, but the version script
        # still needs it in the environment: @changesets/changelog-github calls
        # the GitHub API to resolve each changeset to its PR and author.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
