name: Publish and Release
on:
  push:
    branches:
      - main
permissions: {}
jobs:
  publish:
    name: Publish and create release
    if: |
      github.repository == 'kheopskit/kheopskit' && startsWith(github.event.head_commit.message, 'Version Packages')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org/"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build:packages
      # Nothing rebuilds after this point (no prepack scripts), so what is
      # checked here is what gets published.
      - name: Check type declarations
        run: pnpm check:dts
      - name: Publish Packages
        id: publish
        run: pnpm exec changeset publish
        env:
          NPM_CONFIG_PROVENANCE: true
      - name: Get Version
        id: get_version
        run: |
          VERSION=$(jq -r .version ./package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Fail if release tag already exists
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists."
            echo "The root package version was not bumped - include the root 'kheopskit' package in changesets."
            exit 1
          fi
      - name: Create GitHub Release from the package changelogs
        run: |
          NOTES=""
          for PKG in core react; do
            SECTION=$(awk -v heading="## $VERSION" '$0 == heading {found=1; next} found && /^## / {exit} found END {exit !found}' "packages/$PKG/CHANGELOG.md")
            NOTES+="## @kheopskit/$PKG@$VERSION"$'\n'"$SECTION"$'\n'
          done
          PRERELEASE=()
          if [[ "$VERSION" == *-* ]]; then PRERELEASE=(--prerelease); fi
          echo "$NOTES" | gh release create "v$VERSION" --title "v$VERSION" --target "$GITHUB_SHA" "${PRERELEASE[@]}" --notes-file -
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
