name: Publish and Release
on:
  push:
    branches:
      - main
permissions: {}
jobs:
  publish:
    name: Publish and create release
    if: |
      github.repository == 'kheopskit/kheopskit' && startsWith(github.event.head_commit.message, 'Version Packages')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org/"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build packages
        run: pnpm build:packages
      # Nothing rebuilds after this point (no prepack scripts), so what is
      # checked here is what gets published.
      - name: Check type declarations
        run: pnpm check:dts
      - name: Publish Packages
        id: publish
        run: pnpm exec changeset publish
        env:
          NPM_CONFIG_PROVENANCE: true
      - name: Get Version
        id: get_version
        run: |
          VERSION=$(jq -r .version ./package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Fail if release tag already exists
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists."
            echo "The root package version was not bumped - include the root 'kheopskit' package in changesets."
            exit 1
          fi
      - name: Get PR Number from Commit Message
        id: pr_number
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          PR_NUMBER=$(echo "$HEAD_COMMIT_MESSAGE" | sed -n 's/^Version Packages (#\([0-9]*\)).*/\1/p')
          if [ -z "$PR_NUMBER" ]; then
            echo "No PR number found in commit message: $HEAD_COMMIT_MESSAGE"
            exit 1
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release from Version Packages PR Body
        run: |
          BODY=$(gh pr view "$PR_NUMBER" --json body -q .body)
          # Remove everything up to and including '#Releases' (case-insensitive, handles possible whitespace)
          CLEAN_BODY=$(echo "$BODY" | sed -E '1,/^# [Rr]eleases[[:space:]]*$/d')
          # Remove the section about the root package (## kheopskit ... until next ## or end of file)
          CLEAN_BODY=$(echo "$CLEAN_BODY" | awk '/^## kheopskit(@[0-9A-Za-z.-]+)?/ {skip=1} /^## / && !/^## kheopskit(@[0-9A-Za-z.-]+)?/ {skip=0} !skip')
          echo "$CLEAN_BODY" | gh release create "v$VERSION" --title "v$VERSION" --target "$GITHUB_SHA" --notes-file -
        env:
          PR_NUMBER: ${{ steps.pr_number.outputs.number }}
          VERSION: ${{ steps.get_version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
