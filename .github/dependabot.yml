version: 2

updates:
  # pnpm workspace: the root manifest plus packages/* and examples/*
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    # Mirrors `minimumReleaseAge: 4320` in pnpm-workspace.yaml (3 days), so
    # Dependabot never proposes a version pnpm would refuse to install.
    cooldown:
      default-days: 3
      semver-major-days: 7
    commit-message:
      prefix: "⬆️ "
    open-pull-requests-limit: 10
    ignore:
      # @types/node majors track the Node major they describe, so they must stay
      # on the runtime line pinned in .nvmrc/.node-version/CI (24) — newer types
      # would typecheck against APIs that are absent at runtime. Majors only;
      # 24.x minors and patches (including security ones) still come through.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    groups:
      # Listed first because a dependency joins the first group it matches.
      #
      # These are packages/core's `dependencies` — the only deps that ship in a
      # published manifest, so bumping them always needs a changeset and a
      # release. Split out of the in-range batch so that changeset rides on a
      # small, obvious PR instead of alongside five unrelated devDep bumps.
      # The list is manual (Dependabot has no "production deps of publishable
      # workspaces" selector, and `dependency-type: production` would also
      # scoop up every examples/* runtime dep). Forgetting to extend it is not
      # a correctness problem: `pnpm check:changeset` gates on the diff, not on
      # this list, so a new core dependency is still caught.
      runtime:
        patterns:
          - "@noble/hashes"
          - "@scure/base"
          - "lodash-es"

      # One PR for the routine minor/patch batch. Majors are left ungrouped on
      # purpose: they need review, and the ones in packages/core `dependencies`
      # also need a changeset.
      in-range:
        patterns:
          - "*"
        # Pre-1.0 packages are excluded: Dependabot classifies by version
        # segment, so 0.12.2 -> 0.13.0 counts as "minor" even though ^0.12.2
        # excludes it, and 0.x carries no breakage contract. They get their own
        # PRs. Dependabot has no "in-range only" selector, so this list is
        # manual — a new 0.x dependency lands in the batch until added here.
        exclude-patterns:
          - "@changesets/changelog-github"
          - "@solana-program/*"
          - "class-variance-authority"
          - "mipd"
          - "next-themes"
          - "tsdown"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    commit-message:
      prefix: "⬆️ "
    groups:
      actions:
        patterns:
          - "*"
