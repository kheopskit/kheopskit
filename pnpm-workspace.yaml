packages:
  - examples/*
  - packages/*
  - .
allowBuilds:
  "@reown/appkit": false
  bufferutil: false
  esbuild: false
  simple-git-hooks: false
  utf-8-validate: false
permissions:
  "@tanstack/react-router":
    skills: false
  "@tanstack/react-start":
    skills: false
  tsdown:
    skills: false
overrides:
  # @reown/appkit 2.0.0 network .d.ts files copy viem's Chain type from viem <2.57.17 and stop matching AppKitNetwork on newer viem (reown-com/appkit#5847)
  viem: 2.57.16
  # GHSA-ggr8-5vv4-36mx: write-package@7.2.0 (via @polkadot-api/cli) requires deepmerge-ts ^7.1.0
  "deepmerge-ts@<8.0.0": ^8.0.0
  # GHSA-mrhx-c7xc-m3w5 floor for zod 4, since audit.ignore hides that advisory for every zod version
  "zod@>=4.0.0 <4.6.6": ^4.6.6
  # keeps abitype's zod peer range accepting the zod 3 copies listed under audit.ignore
  "abitype>zod@>=4.0.0 <4.6.6": ^3.22.0 || ^4.6.6

audit:
  ignore:
    # zod 3.x, no patched 3.x release: @reown/appkit-wallet pins 3.22.4, @coinbase/cdp-sdk and @x402/* require ^3
    - GHSA-mrhx-c7xc-m3w5

minimumReleaseAge: 4320
